name: Deploy Frontend + Edge Functions

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy-edge-functions:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Supabase CLI
              run: npm install -g supabase

            - name: Deploy Edge Functions
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
              run: |
                  supabase login --token "$SUPABASE_ACCESS_TOKEN"
                  for fn in ia-status settings test-providers ia-ideas ia-chat ia-idea-cientifica ia-ayuda-semanal plating-generar ware-generar generar-ficha ia-emplatado-imagen ia-emplatado-seleccionar; do
                      echo "Deploying $fn..."
                      # `--yes` es obligatorio: en CI no hay TTY y el CLI pide confirmación.
                      # `settings` ESCRIBE las API keys → exigimos JWT del usuario (verify_jwt).
                      # El resto se despliega con --no-verify-jwt como hasta ahora.
                      if [ "$fn" = "settings" ]; then
                          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes
                      else
                          # Si falla el deploy, el job falla (antes se silenciaba con `|| echo`
                          # y las Edge Functions nunca se despliegan).
                          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
                      fi
                  done

    build-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: "admin-web-frontend/package-lock.json"

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: |
                  cd admin-web-frontend
                  npm ci

            - name: Build
              env:
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
                  VITE_BASE_PATH: /restauranteia-live/
                  VITE_GIT_SHA: ${{ github.sha }}
              run: |
                  cd admin-web-frontend
                  echo "VITE_GIT_SHA=${VITE_GIT_SHA}" > .env.local
                  npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: admin-web-frontend/dist

    deploy-pages:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build-frontend
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4