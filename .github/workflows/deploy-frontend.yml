name: Deploy Frontend + Edge Functions

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

env:
    SUPABASE_PROJECT_REF: iprvxvsqpvsbvqbnfvly

jobs:
    deploy-edge-functions:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Supabase CLI
              run: |
                  npm install -g supabase

            - name: Deploy Edge Functions
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              run: |
                  supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
                  for fn in ia-status settings test-providers ia-ideas ia-chat ia-idea-cientifica ia-ayuda-semanal plating-generar ware-generar generar-ficha; do
                      echo "Deploying $fn..."
                      supabase functions deploy "$fn" --project-ref "${{ env.SUPABASE_PROJECT_REF }}" --no-verify-jwt || echo "Warning: $fn deploy failed"
                  done

    build-frontend:
        runs-on: ubuntu-latest
        needs: deploy-edge-functions
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "admin-web-frontend/node_modules"
                  cache-dependency-path: "admin-web-frontend/package-lock.json"

            - name: Install dependencies
              run: |
                  cd admin-web-frontend
                  npm ci

            - name: Build
              env:
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
                  VITE_BASE_PATH: /restauranteia-live/
              run: |
                  cd admin-web-frontend
                  npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: admin-web-frontend/dist

    deploy-pages:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build-frontend
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4