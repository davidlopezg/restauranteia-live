name: Deploy Frontend + Edge Functions

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy-edge-functions:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install Supabase CLI
              run: npm install -g supabase

            - name: Verificar credenciales de Supabase
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
              run: |
                  if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
                      echo "::error::Falta el secret SUPABASE_ACCESS_TOKEN"
                      exit 1
                  fi
                  if [ -z "$SUPABASE_PROJECT_REF" ]; then
                      echo "::error::Falta el secret SUPABASE_PROJECT_REF (es el ref del proyecto, p.ej. abcdefghijklmnopqrst)"
                      exit 1
                  fi
                  supabase login --token "$SUPABASE_ACCESS_TOKEN"
                  # Si el token está caducado/revocado el CLI falla con 401.
                  if ! supabase projects list --output json > /dev/null 2>&1; then
                      echo "::error::El secret SUPABASE_ACCESS_TOKEN es inválido o expirado. Genera uno nuevo en https://supabase.com/dashboard/account/tokens y actualiza el secret del repo."
                      exit 1
                  fi

            - name: Deploy Edge Functions
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
              run: |
                  FALLOS=""
                  for fn in ia-status settings test-providers ia-ideas ia-chat ia-idea-cientifica ia-ayuda-semanal plating-generar ware-generar generar-ficha ia-emplatado-imagen ia-emplatado-seleccionar; do
                      echo "Deploying $fn..."
                      # `--yes` es obligatorio: en CI no hay TTY y el CLI pide confirmación.
                      # `settings` ESCRIBE las API keys → exigimos JWT del usuario (verify_jwt).
                      # El resto se despliega con --no-verify-jwt como hasta ahora.
                      if [ "$fn" = "settings" ]; then
                          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes || FALLOS="$FALLOS $fn"
                      else
                          supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes || FALLOS="$FALLOS $fn"
                      fi
                  done
                  # Se despliegan TODAS aunque una falle; al final se falla el job si
                  # alguna no se pudo desplegar (antes no se desplegaba ninguna).
                  if [ -n "$FALLOS" ]; then
                      echo "::error::No se pudieron desplegar:$FALLOS"
                      exit 1
                  fi

    build-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: "admin-web-frontend/package-lock.json"

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: |
                  cd admin-web-frontend
                  npm ci

            - name: Build
              env:
                  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
                  VITE_BASE_PATH: /restauranteia-live/
                  VITE_GIT_SHA: ${{ github.sha }}
              run: |
                  cd admin-web-frontend
                  echo "VITE_GIT_SHA=${VITE_GIT_SHA}" > .env.local
                  npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: admin-web-frontend/dist

    deploy-pages:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build-frontend
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4